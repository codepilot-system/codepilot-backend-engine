openapi: 3.0.0
info:
  title: CodePilot Backend API
  version: 1.0.0
servers:
  - url: http://localhost:5000

tags:
  - { name: Auth }
  - { name: Users }
  - { name: Projects }
  - { name: Scans }
  - { name: Issues }
  - { name: AI }
  - { name: Analytics }
  - { name: Health }

components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

security:
  - BearerAuth: []

paths:
  /api/auth/github-url:
    get:
      tags: [Auth]
      security: []
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: { url: "https://github.com/login/oauth/authorize?client_id=sample-id&state=random-state-value" } }

  /api/auth/web/login:
    post:
      tags: [Auth]
      security: []
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [code, state], properties: { code: { type: string }, state: { type: string } } }
      responses:
        200:
          headers:
            Set-Cookie: { schema: { type: string, example: "refreshToken=abcde12345; Path=/; HttpOnly; Secure; SameSite=None" } }
          content:
            application/json:
              example: { status: "success", data: { accessToken: "access-token-sample", user: { id: 1, githubId: 10001, username: "sample-user", avatarUrl: "https://avatars.githubusercontent.com/u/1" } } }

  /api/auth/web/refresh:
    post:
      tags: [Auth]
      security: []
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: { accessToken: "new-jwt-token" } }

  /api/auth/web/logout:
    post:
      tags: [Auth]
      security: []
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      responses:
        200:
          content:
            application/json:
              example: { status: "success", message: "Logged out successfully" }

  /api/auth/extension/login:
    post:
      tags: [Auth]
      security: []
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [githubAccessToken], properties: { githubAccessToken: { type: string } } }
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: { accessToken: "access-token-sample", refreshToken: "refresh-token-sample", user: { id: 1, githubId: 10001, username: "sample-user", avatarUrl: "https://avatars.githubusercontent.com/u/1" } } }

  /api/auth/extension/refresh:
    post:
      tags: [Auth]
      security: []
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: { accessToken: "new-jwt-token", refreshToken: "new-refresh-token" } }

  /api/auth/extension/logout:
    post:
      tags: [Auth]
      security: []
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        200:
          content:
            application/json:
              example: { status: "success", message: "Logged out successfully" }

  /api/users/me:
    get:
      tags: [Users]
      responses:
        200:
          content:
            application/json:
              example:
                status: "success"
                data: { id: 1, githubId: 10001, username: "sample-user", email: "user@sample.com", avatarUrl: "https://avatars.githubusercontent.com/u/1" }
    delete:
      tags: [Users]
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      responses:
        200:
          content:
            application/json:
              example: { status: "success", message: "User account deleted successfully" }

  /api/users/me/sync:
    post:
      tags: [Users]
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      responses:
        200:
          content:
            application/json:
              example:
                status: "success"
                message: "Profile synced with GitHub successfully"
                data: { id: 1, githubId: 10001, username: "synced-user", email: "user@sample.com", avatarUrl: "https://avatars.githubusercontent.com/u/1" }

  /api/projects:
    get:
      tags: [Projects]
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: [{ id: 101, name: "sample-project", repoUrl: "https://github.com/user/sample-project", provider: "github" }] }
    post:
      tags: [Projects]
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [repoUrl], properties: { repoUrl: { type: string }, name: { type: string } } }
      responses:
        201:
          content:
            application/json:
              example: { status: "success", data: { id: 102, name: "new-project", repoUrl: "https://github.com/user/new-project", provider: "github" } }

  /api/projects/{projectId}/members:
    get:
      tags: [Projects]
      parameters: [{ in: path, name: projectId, required: true, schema: { type: integer } }]
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: [{ userId: 1, username: "owner", role: "OWNER" }] }

  /api/projects/{projectId}:
    get:
      tags: [Projects]
      parameters: [{ in: path, name: projectId, required: true, schema: { type: integer } }]
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: { id: 101, name: "sample-project", repoUrl: "https://github.com/user/sample-project", provider: "github" } }
    patch:
      tags: [Projects]
      parameters: 
        - { in: path, name: projectId, required: true, schema: { type: integer } }
        - { in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string } } }
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: { id: 101, name: "updated-name", repoUrl: "https://github.com/user/sample-project", provider: "github" } }
    delete:
      tags: [Projects]
      parameters: 
        - { in: path, name: projectId, required: true, schema: { type: integer } }
        - { in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }
      responses:
        200:
          content:
            application/json:
              example: { status: "success", message: "Project disconnected successfully" }

  /api/scans:
    get:
      tags: [Scans]
      parameters:
        - { in: query, name: projectId, required: true, schema: { type: integer } }
        - { in: query, name: status, required: false, schema: { type: string, enum: [IN_PROGRESS, COMPLETED, FAILED] } }
        - { in: query, name: page, required: false, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 20 } }
      responses:
        200:
          content:
            application/json:
              example:
                status: "success"
                data: [{ id: 501, projectId: 101, initiatorId: 1, status: "COMPLETED", branchName: "main", scanDate: "2026-04-10T12:00:00Z" }]
                pagination: { page: 1, limit: 20, total: 1 }
    post:
      tags: [Scans]
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [projectId, branchName]
              properties:
                projectId: { type: integer }
                branchName: { type: string }
      responses:
        202:
          content:
            application/json:
              example: { status: "success", data: { id: 501, projectId: 101, initiatorId: 1, status: "IN_PROGRESS", branchName: "main", scanDate: "2026-04-10T12:00:00Z" } }

  /api/scans/local-analysis:
    post:
      tags: [Scans]
      parameters: [{ in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [projectId, codeSnippet]
              properties:
                projectId: { type: integer }
                codeSnippet: { type: string }
                filePath: { type: string }
      responses:
        201:
          content:
            application/json:
              example:
                status: "success"
                data:
                  issues: [{ id: 901, severity: "HIGH", category: "SECURITY", summary: "SQL Injection found in login endpoint", codeSnippet: "db.query('SELECT * FROM users WHERE id = ' + id)", status: "OPEN", detectedAt: "2026-04-10T12:00:00Z" }]
                  suggestions: [{ id: 2001, issueId: 901, status: "PENDING", summary: "Apply Parameterized Queries", explanation: "Sample detailed explanation of the AI suggestion.", diffPatch: "--- src/auth.ts\n+++ src/auth.ts\n@@ -10,1 +10,1 @@\n- db.query('SELECT * FROM users WHERE id = ' + id);\n+ db.query('SELECT * FROM users WHERE id = $1', [id]);", generatedAt: "2026-04-10T12:00:00Z" }]

  /api/scans/{scanId}/report:
    get:
      tags: [Scans]
      parameters: [{ in: path, name: scanId, required: true, schema: { type: integer } }]
      responses:
        200:
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /api/scans/{scanId}:
    get:
      tags: [Scans]
      parameters: [{ in: path, name: scanId, required: true, schema: { type: integer } }]
      responses:
        200:
          content:
            application/json:
              example:
                status: "success"
                data: { id: 501, projectId: 101, initiatorId: 1, status: "COMPLETED", branchName: "main", scanDate: "2026-04-10T12:00:00Z" }
    delete:
      tags: [Scans]
      parameters: 
        - { in: path, name: scanId, required: true, schema: { type: integer } }
        - { in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }
      responses:
        200:
          content:
            application/json:
              example: { status: "success", message: "Scan deleted successfully" }

  /api/issues:
    get:
      tags: [Issues]
      parameters:
        - { in: query, name: projectId, required: true, schema: { type: integer } }
        - { in: query, name: scanId, required: false, schema: { type: integer } }
        - { in: query, name: status, required: false, schema: { type: string, enum: [OPEN, FIXED, IGNORED] } }
        - { in: query, name: severity, required: false, schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] } }
        - { in: query, name: category, required: false, schema: { type: string, enum: [SECURITY, PERFORMANCE, FUNCTIONALITY, OTHER] } }
        - { in: query, name: page, required: false, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 20 } }
      responses:
        200:
          content:
            application/json:
              example: 
                status: "success"
                data: [{ id: 901, projectId: 101, scanId: 501, severity: "HIGH", category: "SECURITY", summary: "SQL Injection found in login endpoint", status: "OPEN", detectedAt: "2026-04-10T12:00:00Z" }]
                pagination: { page: 1, limit: 20, total: 1 }

  /api/issues/{issueId}:
    get:
      tags: [Issues]
      parameters: [{ in: path, name: issueId, required: true, schema: { type: integer } }]
      responses:
        200:
          content:
            application/json:
              example:
                status: "success"
                data: { id: 901, projectId: 101, scanId: 501, severity: "HIGH", category: "SECURITY", summary: "SQL Injection found in login endpoint", description: "Sample detailed description of the detected issue.", filePath: "src/auth.ts", codeSnippet: "db.query('SELECT * FROM users WHERE id = ' + id)", lineNumber: 42, status: "OPEN", detectedAt: "2026-04-10T12:00:00Z" }
    patch:
      tags: [Issues]
      parameters: 
        - { in: path, name: issueId, required: true, schema: { type: integer } }
        - { in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { status: { type: string, enum: [OPEN, FIXED, IGNORED] } } }
      responses:
        200:
          content:
            application/json:
              example: 
                status: "success"
                data: { id: 901, projectId: 101, scanId: 501, severity: "HIGH", category: "SECURITY", summary: "SQL Injection found in login endpoint", description: "Sample detailed description of the detected issue.", filePath: "src/auth.ts", codeSnippet: "db.query('SELECT * FROM users WHERE id = ' + id)", lineNumber: 42, status: "FIXED", detectedAt: "2026-04-10T12:00:00Z" }

  /api/ai/suggestions:
    get:
      tags: [AI]
      parameters:
        - { in: query, name: projectId, required: true, schema: { type: integer } }
        - { in: query, name: scanId, required: false, schema: { type: integer } }
        - { in: query, name: issueId, required: false, schema: { type: integer } }
        - { in: query, name: status, required: false, schema: { type: string, enum: [PENDING, APPLIED, DISMISSED] } }
        - { in: query, name: page, required: false, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 20 } }
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: [{ id: 2001, projectId: 101, scanId: 501, issueId: 901, status: "PENDING", summary: "Apply Parameterized Queries", generatedAt: "2026-04-10T12:00:00Z" }], pagination: { page: 1, limit: 20, total: 1 } }

  /api/ai/suggestions/{suggestionId}:
    get:
      tags: [AI]
      parameters: [{ in: path, name: suggestionId, required: true, schema: { type: integer } }]
      responses:
        200:
          content:
            application/json:
              example:
                status: "success"
                data: { id: 2001, projectId: 101, scanId: 501, issueId: 901, status: "PENDING", summary: "Apply Parameterized Queries", explanation: "Sample detailed explanation of the AI suggestion.", diffPatch: "--- src/auth.ts\n+++ src/auth.ts\n@@ -10,1 +10,1 @@\n- db.query('SELECT * FROM users WHERE id = ' + id);\n+ db.query('SELECT * FROM users WHERE id = $1', [id]);", generatedAt: "2026-04-10T12:00:00Z" }

  /api/ai/suggestions/{suggestionId}/apply:
    post:
      tags: [AI]
      parameters: 
        - { in: path, name: suggestionId, required: true, schema: { type: integer } }
        - { in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: { id: 2001, status: "APPLIED", branchName: "codepilot/fix-2001" } }

  /api/ai/suggestions/{suggestionId}/dismiss:
    post:
      tags: [AI]
      parameters: 
        - { in: path, name: suggestionId, required: true, schema: { type: integer } }
        - { in: header, name: X-Requested-With, required: true, schema: { type: string, default: XMLHttpRequest } }
      responses:
        200:
          content:
            application/json:
              example: { status: "success", data: { id: 2001, status: "DISMISSED" } }

  /api/analytics:
    get:
      tags: [Analytics]
      parameters:
        - { in: query, name: projectId, required: true, schema: { type: integer } }
        - { in: query, name: scanId, required: false, schema: { type: integer } }
        - { in: query, name: page, required: false, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 20 } }
      responses:
        200:
          content:
            application/json:
              example:
                status: "success"
                data: [{ projectId: 101, scanId: 501, avgComplexity: 12.5, technicalDebtScore: 85, severityDistribution: { high: 2, medium: 5, low: 10 }, generatedAt: "2026-04-10T12:00:00Z" }]
                pagination: { page: 1, limit: 20, total: 1 }

  /api/health:
    get:
      tags: [Health]
      security: []
      responses:
        200:
          content:
            application/json:
              example: { status: "success", message: "CodePilot Backend Engine is live!" }
